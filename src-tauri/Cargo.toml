[package]
name = "jamproject-desktop"
version = "1.0.0"
description = "JamProject Desktop"
authors = ["JamProject"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "jamproject_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
discord-rich-presence = "1.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
